name: Deploy to Hostinger

on:
  push:
    branches: [main, staging]

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.STAGING_NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.STAGING_NEXTAUTH_URL }}

      - name: Deploy staging via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Default is 10m; npm ci + next build on a small VPS often needs longer.
          command_timeout: 45m
          script: |
            cd /var/www/ready2cook-staging
            git fetch origin
            git checkout staging
            git pull origin staging
            npm ci
            npx prisma migrate deploy
            npm run build
            if pm2 describe ready2cook-staging >/dev/null 2>&1; then
              pm2 restart ready2cook-staging --update-env
            else
              HOSTNAME=127.0.0.1 PORT=3001 pm2 start npm --name ready2cook-staging -- start
            fi
            pm2 save

  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}

      - name: Deploy production via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 45m
          script: |
            cd /var/www/ready2cook
            git fetch origin
            git checkout main
            git pull origin main
            npm ci
            npx prisma migrate deploy
            npm run build
            if pm2 describe ready2cook >/dev/null 2>&1; then
              pm2 restart ready2cook --update-env
            else
              HOSTNAME=127.0.0.1 PORT=3000 pm2 start npm --name ready2cook -- start
            fi
            pm2 save
